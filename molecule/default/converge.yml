---
- name: Converge
  hosts: all
  gather_facts: true
  pre_tasks:
    - name: Set ansible_os_family for NixOS hosts
      ansible.builtin.set_fact:
        ansible_os_family: NixOS
      when: (ansible_distribution == 'NixOS') or ('nixos' in (inventory_hostname | lower))
  roles:
    - role: ea31337.xvfb
  vars:
    xvfb_install_x11_utils: true
    # Opt-in: assign a unique X display per host when MOLECULE_XVFB_DISPLAY_BASE
    # is set. Required when containers share the host network namespace
    # (MOLECULE_DOCKER_NETWORK=host) and the host already runs an X server on :0.
    # Usage: MOLECULE_XVFB_DISPLAY_BASE=90 molecule test
    xvfb_display: >-
      {{ (lookup('env', 'MOLECULE_XVFB_DISPLAY_BASE') | default('', true) | length > 0)
         | ternary(':' ~ (lookup('env', 'MOLECULE_XVFB_DISPLAY_BASE') | int +
                          (groups['all'] | list).index(inventory_hostname)), ':0') }}
